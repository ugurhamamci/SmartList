name: smartlist
description: "SmartList - AI-powered collaborative shopping lists"
publish_to: 'none'

# versionName / versionCode are overridden by CI via --build-name / --build-number.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies are sorted alphabetically to satisfy `sort_pub_dependencies`.
# See docs/ARCHITECTURE.md for which layer each package belongs to.
dependencies:
  cached_network_image: ^3.4.1
  collection: ^1.19.1
  connectivity_plus: ^7.3.1
  cupertino_icons: ^1.0.8
  dio: ^5.10.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_hooks: ^0.21.3+1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  google_fonts: ^8.2.0
  google_sign_in: ^7.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hooks_riverpod: ^3.3.2
  image_picker: ^1.2.3
  # Pinned by flutter_localizations, which depends on intl 0.20.2 exactly.
  intl: ^0.20.2
  json_annotation: ^4.12.0
  logger: ^2.7.0
  lottie: ^3.5.1
  mobile_scanner: ^7.4.0
  package_info_plus: ^10.2.1
  permission_handler: ^12.0.3
  qr_flutter: ^4.1.0
  riverpod_annotation: ^4.0.3
  share_plus: ^13.3.0
  sign_in_with_apple: ^8.1.0
  speech_to_text: ^7.4.0
  supabase_flutter: ^2.16.0
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.0
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.4
  very_good_analysis: ^10.3.0

# Android ve iOS launcher ikonları logodan üretilir.
#   dart run flutter_launcher_icons
# Üretilen dosyalar android/ ve ios/ altına yazılır ve depoda izlenir; bu yüzden
# logo değişmedikçe komutu tekrar çalıştırmak gerekmez.
flutter_launcher_icons:
  image_path: assets/images/smartlist_logo.png
  android: true
  ios: true
  remove_alpha_ios: true
  # Uyarlanabilir ikonun arka planı, logonun mor zeminiyle aynı.
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: assets/images/smartlist_logo.png
  web:
    generate: true
    background_color: "#F9F9FF"
    theme_color: "#4F46E5"

flutter:
  uses-material-design: true

  # Generates the localization delegates declared in l10n.yaml.
  generate: true

  assets:
    - assets/images/
    - assets/lottie/

  # Hanken Grotesk uygulamaya gömülüdür; google_fonts paketinin çalışma anında
  # indirmesine bırakılmaz. Sebep: indirme ilk açılışta ağ gerektirir, yazı
  # tipi geç yüklendiği için görünür bir sıçrama olur ve testler ağ olmadan
  # çalışmaz. Tek dosyalık değişken font (100..900) üç statik dosyadan küçüktür.
  # Lisans: assets/fonts/OFL.txt (SIL Open Font License 1.1)
  fonts:
    - family: Hanken Grotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Variable.ttf
