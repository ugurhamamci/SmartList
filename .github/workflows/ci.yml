name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Generate code
        run: dart run build_runner build

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Fail if generated code is stale
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated output differs from what is committed:"
            git status --porcelain
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  schema:
    name: Postgres schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Migration'lar bir veritabani olmadan da soz dizimi acisindan
      # dogrulanabiliyor: pgsql-parser gercek Postgres ayristiricisini kullanir.
      # PL/pgSQL govdeleri ayristiriciya metin gorundugu icin bu kontrol
      # davranisi kanitlamaz; onu tool/verify_backend.mjs canli projede yapiyor.
      - name: Install the Postgres parser
        run: npm install --no-save pgsql-parser

      - name: Parse every migration
        run: |
          node --input-type=module -e "
          import { readdirSync, readFileSync } from 'node:fs';
          import { parse } from 'pgsql-parser';
          const dir = 'supabase/migrations';
          let failed = 0;
          for (const file of readdirSync(dir).filter(f => f.endsWith('.sql')).sort()) {
            try {
              await parse(readFileSync(dir + '/' + file, 'utf8'));
              console.log('OK   ' + file);
            } catch (error) {
              failed++;
              console.log('FAIL ' + file + ': ' + error.message);
            }
          }
          process.exit(failed === 0 ? 0 : 1);
          "

  android:
    name: Android release
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [staging, production]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          echo "$KEY_PROPERTIES" > android/key.properties

      - name: Build app bundle
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          flutter build appbundle \
            --release \
            --build-number "${{ github.run_number }}" \
            --dart-define=FLAVOR="$FLAVOR" \
            --dart-define=AI_PROXY_BASE_URL="${{ secrets.AI_PROXY_BASE_URL }}" \
            --dart-define=FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}" \
            --dart-define=FIREBASE_API_KEY_ANDROID="${{ secrets.FIREBASE_API_KEY_ANDROID }}" \
            --dart-define=FIREBASE_APP_ID_ANDROID="${{ secrets.FIREBASE_APP_ID_ANDROID }}" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" \
            --dart-define=FIREBASE_STORAGE_BUCKET="${{ secrets.FIREBASE_STORAGE_BUCKET }}"

      - uses: actions/upload-artifact@v4
        with:
          name: smartlist-${{ matrix.flavor }}-aab
          path: build/app/outputs/bundle/release/*.aab

  ios:
    name: iOS release
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    strategy:
      matrix:
        flavor: [staging, production]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Signing is handled by the provisioning profile installed here; see
      # docs/RELEASE.md for the certificate and profile secrets required.
      - name: Build iOS archive
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          flutter build ipa \
            --release \
            --build-number "${{ github.run_number }}" \
            --dart-define=FLAVOR="$FLAVOR" \
            --dart-define=AI_PROXY_BASE_URL="${{ secrets.AI_PROXY_BASE_URL }}" \
            --dart-define=FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}" \
            --dart-define=FIREBASE_API_KEY_IOS="${{ secrets.FIREBASE_API_KEY_IOS }}" \
            --dart-define=FIREBASE_APP_ID_IOS="${{ secrets.FIREBASE_APP_ID_IOS }}" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" \
            --dart-define=FIREBASE_STORAGE_BUCKET="${{ secrets.FIREBASE_STORAGE_BUCKET }}" \
            --no-codesign

      - uses: actions/upload-artifact@v4
        with:
          name: smartlist-${{ matrix.flavor }}-ios
          path: build/ios/archive
