# SmartList — Supabase CLI yapilandirmasi
#
# Bu dosya CLI'nin projeyi tanimasi icin gerekli. Yerel gelistirme (supabase
# start) Docker istiyor; sunucu makinesinde Docker olmadigi icin migration'lar
# dogrudan uzak veritabanina uygulaniyor:
#
#   npx supabase db push --db-url "$env:SUPABASE_DB_URL"
#
# DIKKAT: db-url olarak "Session pooler" dizgesini kullanin. "Direct
# connection" (db.<ref>.supabase.co) yalnizca IPv6 destekliyor.

project_id = "gjhuyouzbbcavrgejujs"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# Tek istekte donebilecek en fazla satir. Sohbet ve urun listeleri
# sayfalandigi icin bu siniri asan bir sorgu tasarim hatasi demek.
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Canli proje Postgres 17 uzerinde; golge veritabani da ayni olmali ki
# migration'lar ayni davranissa dogrulanabilsin.
major_version = 17

[db.pooler]
enabled = true

[auth]
enabled = true
# Uygulama derin baglantisi: davet linki uygulamada acilir.
site_url = "smartlist://join"
additional_redirect_urls = ["smartlist://join", "http://localhost:8080"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

# Supabase'in alt siniri 6; kisa sifreler saldiriya cok acik oldugu icin
# yukari cekiyoruz. Bu iki anahtar [auth] altinda, [auth.email] altinda degil.
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
# Gelistirmede e-posta dogrulamasi kapali; canlida Dashboard'dan acilacak.
enable_confirmations = false
double_confirm_changes = true
secure_password_change = false

[storage]
enabled = true
# Urun fotografi ve profil resmi icin yeterli; daha buyugu istemcide
# yeniden olceklendirilecek.
file_size_limit = "5MiB"

[realtime]
enabled = true

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
